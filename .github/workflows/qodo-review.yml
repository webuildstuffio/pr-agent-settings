# Qodo AI Code Suggestions v3.3.1
# Inline code suggestions only — the highest-value, lowest-noise output.
# All config lives in webuildstuffio/pr-agent-settings/.pr_agent.toml (global)
# and per-repo .pr_agent.toml (overrides). This workflow is intentionally
# minimal.
#
# Model: openrouter/free primary (anti-model-rot, owner order 2026-10-09).
# API: direct OpenRouter (no AI Gateway proxy — CF gateway corrupts
# streaming).
# NOTE: webuildstuffio/pr-agent-settings MUST stay PUBLIC — the default
# GITHUB_TOKEN cannot read it as a private repo (404), which silently drops
# all global tuning (temperature, score threshold, focus instructions).
# /review and /describe available via manual /command in PR comments.
#
# CHANGELOG:
# v3.3.1: (Sep 30 2026) Scope concurrency group by event name — a
#          comment-triggered run (skips in ~1s) must never cancel an
#          in-progress pull_request run.
# v3.3.0: (Sep 30 2026) Concurrency groups, improved caching, permission polish.
# v3.2.1: (Sep 29 2026) Bypass CF AI Gateway — route directly to OpenRouter.
# v3.2.0: (Sep 29 2026) gemma-4-31b primary + 8-model :free fallback chain.

name: Qodo AI Code Suggestions

"on":
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number (empty = latest open PR)"
        required: false
        type: string

concurrency:
  # Group includes the event type. The workflow also fires on issue_comment (for
  # manual /improve), and EVERY comment on a PR (CI bot reports, review
  # threads) shares group qodo-<PR#> with the in-progress pull_request
  # suggestions run — without the event name, cancel-in-progress kills Qodo
  # mid-run and the comment-run then skips in ~1s. Seen 2026-09-29/30:
  # shell-config#499, folio-app#2596/#2597. Same-event-type dedup is
  # preserved: reopen cancels a stale open-run, a newer /improve supersedes
  # an older one.
  group: >-
    qodo-${{ github.event_name }}-${{
      github.event.pull_request.number || github.event.issue.number ||
      github.run_id }}
  cancel-in-progress: true

jobs:
  suggest:
    if: >-
      ${{
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'dependabot/')
        ) ||
        (github.event_name == 'workflow_dispatch') ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          (
            contains(github.event.comment.body, '/improve') ||
            contains(github.event.comment.body, '/review') ||
            contains(github.event.comment.body, '/describe')
          )
        )
      }}
    runs-on: ubicloud-standard-2
    timeout-minutes: 8
    continue-on-error: true
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: Code Suggestions (free models)
    steps:
      - name: Docker Cache
        uses: actions/cache@v6
        with:
          path: /var/lib/docker
          key: qodo-docker-${{ runner.os }}
          restore-keys: qodo-docker-

      - name: Set PR for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v9
        with:
          script: |
            const n = '${{ github.event.inputs.pr_number }}';
            if (n) { core.exportVariable('TARGET_PR', n); return; }
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', sort: 'updated', direction: 'desc', per_page: 1
            });
            if (prs.length) { core.exportVariable('TARGET_PR', prs[0].number); }
            else { core.setFailed('No open PRs'); }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Qodo /improve
        uses: qodo-ai/pr-agent@v0.46.0
        env:
          OPENROUTER__KEY: ${{ secrets.QODO_OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "openrouter/free"
          config.fallback_models: >-
            ["openrouter/free"]
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "131072"
          github_action_config.auto_improve: "true"
          github_action_config.auto_review: "false"
          github_action_config.auto_describe: "false"
